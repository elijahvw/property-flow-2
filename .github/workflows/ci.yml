name: CI

on:
  pull_request:
    branches: [ main, "codex/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: propertyflow_access_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test development power controls
        run: |
          python3 -m pip install unittest-xml-reporting==3.2.0
          python3 -m xmlrunner discover -s tests/operations -p 'test_*.py' -o test-results/python

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.1'
          terraform_wrapper: false
      - name: Validate custom-domain Terraform with mocked AWS
        run: |
          terraform fmt -check infra/terraform/envs/dev/main.tf infra/terraform/envs/dev/variables.tf infra/terraform/envs/dev/outputs.tf infra/terraform/modules/s3_frontend/main.tf infra/terraform/modules/s3_frontend/variables.tf infra/terraform/modules/s3_frontend/versions.tf infra/terraform/modules/s3_frontend/tests/custom-domain.tftest.hcl
          terraform -chdir=infra/terraform/modules/s3_frontend init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/s3_frontend test -no-color
          terraform -chdir=infra/terraform/envs/dev init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/dev validate -no-color
      - name: Validate Alloy task capacity and lifecycle with mocked AWS
        run: |
          terraform fmt -check infra/terraform/envs/dev/alloy.tf infra/terraform/modules/ecr/alloy.tf infra/terraform/modules/ecr/main.tf infra/terraform/modules/ecr/tests/alloy.tftest.hcl
          terraform -chdir=infra/terraform/modules/ecr init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/ecr test -no-color
          docker pull --quiet grafana/alloy:v1.21.1
          python3 scripts/test-alloy-config.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        
      - name: Build and test backend
        env:
          DATABASE_URL: postgresql://dummy@localhost:5432/dummy
          TEST_DATABASE_URL: postgresql://postgres:isolated-test-password@localhost:5432/propertyflow_access_test
        run: |
          npm run build --prefix server
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/server.xml server/tests/*.test.mjs

      - name: Test browser operations and authentication deadlines
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/browser.xml client/tests/*.test.cjs

      - name: Build (Client)
        run: npm run build --workspace=@property-flow/client

      - name: Test owner onboarding with isolated browser fixtures
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/onboarding.xml
        run: |
          npx playwright install --with-deps --only-shell chromium
          npx playwright test -c playwright.onboarding.config.ts --reporter=line,junit

      - name: Test enabled production RUM with intercepted network
        env:
          VITE_RUM_ENABLED: 'true'
          VITE_FARO_COLLECTOR_URL: https://faro-collector-prod-us-east-3.grafana.net/collect/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          npm run build --workspace=@property-flow/client
          node scripts/test-rum.mjs

      - name: Test actual Grafana provisioning and Prometheus alert expressions
        run: |
          docker pull --quiet grafana/grafana:13.2.2
          docker pull --quiet prom/prometheus:v3.15.0
          python3 scripts/test-grafana.py
          python3 scripts/test-monitoring-rules.py

      - name: Test authenticated OpenTelemetry signals and real PostgreSQL trace privacy
        run: node scripts/test-observability.mjs

      - name: Test maintenance response loss and durable replay on disposable PostgreSQL
        run: node scripts/test-maintenance.mjs

      - name: Test units and leases with disposable PostgreSQL and real browser
        run: node scripts/test-leasing.mjs

      - name: Test manual finances on disposable PostgreSQL
        run: node scripts/test-finances.mjs

      - name: Test pre-login user setup on disposable PostgreSQL
        run: node scripts/test-users.mjs

      - name: Test support impersonation on disposable PostgreSQL
        run: node scripts/test-impersonation.mjs

      - name: Test company subscriptions, feature controls, usage and billing
        run: node scripts/test-company-billing.mjs

      - name: Test historical cash, availability and reviewed unit imports
        run: node scripts/test-roadmap.mjs

      - name: Test sales demo setup, source links, recovery and teardown
        run: node scripts/test-sales-demo.mjs

      - name: Keep test reports in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  terraform-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Format
        run: terraform fmt -check -recursive infra/terraform
        
      - name: Terraform Init
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend=false -input=false
        
      - name: Terraform Validate
        run: cd infra/terraform/envs/dev && terraform validate

      - name: Validate Grafana Cloud configuration (no credentials or backend)
        run: |
          terraform -chdir=infra/terraform/grafana-cloud init -backend=false -input=false
          terraform -chdir=infra/terraform/grafana-cloud validate
