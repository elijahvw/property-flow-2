name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Test development power controls
        run: python3 -m unittest discover -s tests/operations -p 'test_*.py'

      - name: Install dependencies
        run: npm install
        
      - name: Build and test server tracing
        env:
          DATABASE_URL: postgresql://dummy@localhost:5432/dummy
        run: |
          npm ci --prefix server
          npm run build --prefix server
          node --test server/tests/tracing.test.mjs

      - name: Test protected client routes
        run: node --test client/tests/access.test.cjs

      - name: Build (Client)
        run: npm run build --workspace=@property-flow/client

  terraform-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Format
        run: terraform fmt -check -recursive infra/terraform
        
      - name: Terraform Init
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend=false -input=false
        
      - name: Terraform Validate
        run: cd infra/terraform/envs/dev && terraform validate
