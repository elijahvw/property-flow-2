name: Deploy Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      plan_only:
        description: Preview infrastructure without deploying
        required: true
        default: true
        type: boolean
      force_all:
        description: 'Deploy all components (also use after changing GitHub variables or secrets)'
        required: true
        default: false
        type: boolean
      run_terraform:
        description: 'Control Terraform apply for this deploy'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - always
          - never

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  terraform-changes:
    name: Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      should_apply: ${{ steps.decision.outputs.infrastructure }}
      backend: ${{ steps.decision.outputs.backend }}
      frontend: ${{ steps.decision.outputs.frontend }}
      previous_versions: ${{ steps.decision.outputs.previous_versions }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan changed components
        id: decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_TERRAFORM: ${{ inputs.run_terraform || 'auto' }}
          FORCE_ALL: ${{ inputs.force_all || false }}
        run: python3 scripts/plan-dev-release.py

  terraform:
    name: Terraform
    needs: terraform-changes
    runs-on: ubuntu-latest
    outputs:
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
      cloudfront_url: ${{ steps.outputs.outputs.cloudfront_url }}
      repository_url: ${{ steps.outputs.outputs.repository_url }}
      ecs_cluster_name: ${{ steps.outputs.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.outputs.outputs.ecs_service_name }}
      alb_dns_name: ${{ steps.outputs.outputs.alb_dns_name }}
      frontend_bucket_name: ${{ steps.outputs.outputs.frontend_bucket_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
      - name: Skip Apply
        if: needs.terraform-changes.outputs.should_apply != 'true'
        run: echo "Skipping terraform apply because ${{ needs.terraform-changes.outputs.reason }}."
      - name: Verify target account
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          test "$account_id" = "800754316001" || { echo "Unexpected AWS account: $account_id"; exit 1; }
      - name: Plan
        if: github.event_name != 'workflow_dispatch' || inputs.plan_only || needs.terraform-changes.outputs.should_apply == 'true'
        env:
          TF_VAR_auth0_domain: ${{ vars.VITE_AUTH0_DOMAIN }}
          TF_VAR_auth0_audience: ${{ vars.VITE_AUTH0_AUDIENCE }}
          TF_VAR_auth0_m2m_client_id: ${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}
          TF_VAR_auth0_m2m_client_secret: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
          TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_site: datadoghq.com
        run: |
          cd infra/terraform/envs/dev
          # The saved plan contains secrets; keep it on this ephemeral runner.
          terraform plan -input=false -out=dev.tfplan
      - name: Start existing database before deployment
        if: github.event_name == 'workflow_dispatch' && !inputs.plan_only && needs.terraform-changes.outputs.backend == 'true'
        env:
          SHOULD_APPLY: ${{ needs.terraform-changes.outputs.should_apply }}
        run: |
          if [ "$SHOULD_APPLY" = "true" ]; then
            bash scripts/dev-power.sh start-database --allow-missing
          else
            bash scripts/dev-power.sh start-database
          fi
      - name: Apply reviewed configuration
        if: github.event_name == 'workflow_dispatch' && !inputs.plan_only && needs.terraform-changes.outputs.should_apply == 'true'
        run: |
          cd infra/terraform/envs/dev
          terraform apply -input=false dev.tfplan
      - name: Get Outputs
        if: github.event_name == 'workflow_dispatch' && !inputs.plan_only
        id: outputs
        run: |
          cd infra/terraform/envs/dev
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "repository_url=$(terraform output -raw repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT

  deploy-backend:
    if: github.event_name == 'workflow_dispatch' && !inputs.plan_only && needs.terraform-changes.outputs.backend == 'true'
    needs: [terraform-changes, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up cached Docker builder
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ needs.terraform.outputs.repository_url }}:latest
            ${{ needs.terraform.outputs.repository_url }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=propertyflow-server
          cache-to: type=gha,mode=max,scope=propertyflow-server
      - name: Ensure database is available before starting backend
        run: bash scripts/dev-power.sh start-database
      - name: Update ECS service
        run: |
          set -euo pipefail

          CLUSTER="${{ needs.terraform.outputs.ecs_cluster_name }}"
          SERVICE="${{ needs.terraform.outputs.ecs_service_name }}"

          print_diagnostics() {
            echo "Collecting ECS diagnostics for $SERVICE"
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].deployments[*].[id,status,rolloutState,desiredCount,pendingCount,runningCount,failedTasks,taskDefinition]' \
              --output table || true

            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].events[0:20].[createdAt,message]' \
              --output table || true

            TARGET_GROUP_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            if [ "$TARGET_GROUP_ARN" != "None" ]; then
              aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --query 'TargetHealthDescriptions[*].[Target.Id,TargetHealth.State,TargetHealth.Reason,TargetHealth.Description]' \
                --output table || true
            fi

            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster "$CLUSTER" \
              --service-name "$SERVICE" \
              --desired-status STOPPED \
              --max-items 5 \
              --query 'taskArns' \
              --output text)

            if [ "$STOPPED_TASKS" != "None" ] && [ -n "$STOPPED_TASKS" ]; then
              aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks $STOPPED_TASKS \
                --query 'tasks[*].[taskArn,lastStatus,stoppedReason,containers[0].reason]' \
                --output table || true
            fi
          }

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)

          if [ "$DESIRED_COUNT" = "None" ] || [ -z "$DESIRED_COUNT" ] || [ "$DESIRED_COUNT" -lt 1 ]; then
            DESIRED_COUNT=1
          fi

          echo "Deploying service $SERVICE in cluster $CLUSTER"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count "$DESIRED_COUNT" --force-new-deployment > /dev/null

          if aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "ECS service stabilized on first attempt."
            exit 0
          fi

          echo "ECS did not stabilize in time. Keeping the existing service running."
          print_diagnostics
          exit 1
      - name: Verify backend readiness
        env:
          ALB_DNS_NAME: ${{ needs.terraform.outputs.alb_dns_name }}
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service_name }}
        run: |
          set -euo pipefail

          READY_URL="http://${ALB_DNS_NAME}/api/ready"
          echo "Probing readiness endpoint: $READY_URL"

          print_diagnostics() {
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].events[0:20].[createdAt,message]' \
              --output table || true

            TARGET_GROUP_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            if [ "$TARGET_GROUP_ARN" != "None" ]; then
              aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --query 'TargetHealthDescriptions[*].[Target.Id,TargetHealth.State,TargetHealth.Reason,TargetHealth.Description]' \
                --output table || true
            fi

            LOG_GROUP="/ecs/${SERVICE}"
            if aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'length(logGroups)' --output text | grep -qv '^0$'; then
              echo "Recent application logs from $LOG_GROUP"
              aws logs tail "$LOG_GROUP" --since 10m --format short | tail -n 200 || true
            fi
          }

          unknown_500_count=0
          max_attempts=12

          for attempt in $(seq 1 "$max_attempts"); do
            status_code=$(curl -sS -o /tmp/backend-ready.json -w "%{http_code}" "$READY_URL" || true)
            if [ "$status_code" = "200" ]; then
              echo "Backend readiness check passed."
              cat /tmp/backend-ready.json
              exit 0
            fi

            echo "Readiness probe attempt $attempt/$max_attempts returned HTTP $status_code"
            cat /tmp/backend-ready.json || true

            if [ "$status_code" = "500" ] && grep -q '"db":"unknown"' /tmp/backend-ready.json; then
              unknown_500_count=$((unknown_500_count + 1))
            else
              unknown_500_count=0
            fi

            if [ "$unknown_500_count" -ge 3 ]; then
              echo "Backend readiness returned 500 with db=unknown 3 times in a row. Failing fast."
              print_diagnostics
              exit 1
            fi

            sleep 10
          done

          echo "Backend readiness check failed after retries."
          print_diagnostics
          exit 1

  deploy-frontend:
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.plan_only && needs.terraform-changes.outputs.frontend == 'true' && needs.terraform.result == 'success' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs:
      - terraform-changes
      - terraform
      - deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build & Deploy
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_DATADOG_SITE: datadoghq.com
          VITE_DATADOG_APPLICATION_ID: ${{ vars.VITE_DATADOG_APPLICATION_ID }}
          VITE_DATADOG_CLIENT_TOKEN: ${{ vars.VITE_DATADOG_CLIENT_TOKEN }}
          VITE_DATADOG_SERVICE: property-flow-client
          VITE_DATADOG_ENV: dev
          VITE_DATADOG_TRACE_SAMPLE_RATE: ${{ vars.VITE_DATADOG_TRACE_SAMPLE_RATE || '100' }}
          VITE_DATADOG_SESSION_SAMPLE_RATE: ${{ vars.VITE_DATADOG_SESSION_SAMPLE_RATE || '100' }}
          VITE_DATADOG_SESSION_REPLAY_SAMPLE_RATE: ${{ vars.VITE_DATADOG_SESSION_REPLAY_SAMPLE_RATE || '20' }}
          VITE_APP_VERSION: ${{ github.sha }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
          DATADOG_API_HOST: api.datadoghq.com
          FRONTEND_BUCKET: ${{ needs.terraform.outputs.frontend_bucket_name }}
        run: |
          npm install
          cd client && npm run build
          cd ..
          npx @datadog/datadog-ci@latest sourcemaps upload ./client/dist/assets \
            --service "$VITE_DATADOG_SERVICE" \
            --release-version "$VITE_APP_VERSION" \
            --minified-path-prefix "https://${{ needs.terraform.outputs.cloudfront_url }}/assets"
          aws s3 sync client/dist/ "s3://$FRONTEND_BUCKET" --delete
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform.outputs.cloudfront_distribution_id }} --paths "/*"
      - name: Verify public application and authentication
        env:
          PUBLIC_URL: https://${{ needs.terraform.outputs.cloudfront_url }}
        run: |
          bash scripts/verify-dev-public.sh "$PUBLIC_URL"
          echo "Deployed commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

  record-release-state:
    name: Remember successful component releases
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.plan_only && needs.terraform-changes.result == 'success'
    needs: [terraform-changes, terraform, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record only successful releases
        env:
          RECORD_STATE: 'true'
          PREVIOUS_VERSIONS: ${{ needs.terraform-changes.outputs.previous_versions }}
          COMPONENT_RESULTS: '{"infrastructure":"${{ needs.terraform.result }}","backend":"${{ needs.deploy-backend.result }}","frontend":"${{ needs.deploy-frontend.result }}"}'
          INFRASTRUCTURE_APPLIED: ${{ needs.terraform-changes.outputs.should_apply }}
        run: python3 scripts/plan-dev-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: dev-release-state
          path: release-state.json
          retention-days: 90
