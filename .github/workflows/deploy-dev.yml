name: Deploy Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: 'Control Terraform apply for this deploy'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - always
          - never

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  terraform-changes:
    name: Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      should_apply: ${{ steps.decision.outputs.should_apply }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Terraform should apply
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_TERRAFORM: ${{ inputs.run_terraform || 'auto' }}
        run: |
          should_apply=true
          reason="dev deploy reapplies terraform by default"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$RUN_TERRAFORM" in
              always)
                should_apply=true
                reason="manual run with run_terraform=always"
                ;;
              never)
                should_apply=false
                reason="manual run with run_terraform=never"
                ;;
              auto)
                should_apply=true
                reason="manual run with run_terraform=auto"
                ;;
              *)
                echo "Unsupported run_terraform value: $RUN_TERRAFORM"
                exit 1
                ;;
            esac
          else
            should_apply=true
            reason="push to main deploy reapplies terraform"
          fi

          echo "should_apply=$should_apply" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Terraform apply decision: $reason"

  terraform:
    name: Terraform
    needs: terraform-changes
    runs-on: ubuntu-latest
    outputs:
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
      repository_url: ${{ steps.outputs.outputs.repository_url }}
      ecs_cluster_name: ${{ steps.outputs.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.outputs.outputs.ecs_service_name }}
      alb_dns_name: ${{ steps.outputs.outputs.alb_dns_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: |
          cd infra/terraform/envs/dev
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
      - name: Skip Apply
        if: needs.terraform-changes.outputs.should_apply != 'true'
        run: echo "Skipping terraform apply because ${{ needs.terraform-changes.outputs.reason }}."
      - name: Apply
        if: needs.terraform-changes.outputs.should_apply == 'true'
        run: |
          cd infra/terraform/envs/dev
          terraform apply -auto-approve \
            -var="auth0_domain=${{ vars.VITE_AUTH0_DOMAIN }}" \
            -var="auth0_audience=${{ vars.VITE_AUTH0_AUDIENCE }}" \
            -var="auth0_m2m_client_id=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}" \
            -var="auth0_m2m_client_secret=${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}" \
            -var="db_password=${{ secrets.DATABASE_PASSWORD }}" \
            -var="datadog_api_key=${{ secrets.DATADOG_API_KEY }}"
      - name: Get Outputs
        id: outputs
        run: |
          cd infra/terraform/envs/dev
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "repository_url=$(terraform output -raw repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

  deploy-backend:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY_URL: ${{ needs.terraform.outputs.repository_url }}
          IMAGE_TAG: latest
        run: |
          docker build -t $REPOSITORY_URL:$IMAGE_TAG ./server
          docker push $REPOSITORY_URL:$IMAGE_TAG
      - name: Update ECS service
        run: |
          set -euo pipefail

          CLUSTER="${{ needs.terraform.outputs.ecs_cluster_name }}"
          SERVICE="${{ needs.terraform.outputs.ecs_service_name }}"

          print_diagnostics() {
            echo "Collecting ECS diagnostics for $SERVICE"
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].deployments[*].[id,status,rolloutState,desiredCount,pendingCount,runningCount,failedTasks,taskDefinition]' \
              --output table || true

            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].events[0:20].[createdAt,message]' \
              --output table || true

            TARGET_GROUP_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            if [ "$TARGET_GROUP_ARN" != "None" ]; then
              aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --query 'TargetHealthDescriptions[*].[Target.Id,TargetHealth.State,TargetHealth.Reason,TargetHealth.Description]' \
                --output table || true
            fi

            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster "$CLUSTER" \
              --service-name "$SERVICE" \
              --desired-status STOPPED \
              --max-items 5 \
              --query 'taskArns' \
              --output text)

            if [ "$STOPPED_TASKS" != "None" ] && [ -n "$STOPPED_TASKS" ]; then
              aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks $STOPPED_TASKS \
                --query 'tasks[*].[taskArn,lastStatus,stoppedReason,containers[0].reason]' \
                --output table || true
            fi
          }

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)

          if [ "$DESIRED_COUNT" = "None" ] || [ -z "$DESIRED_COUNT" ] || [ "$DESIRED_COUNT" -lt 1 ]; then
            DESIRED_COUNT=1
          fi

          echo "Deploying service $SERVICE in cluster $CLUSTER"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment > /dev/null

          if aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "ECS service stabilized on first attempt."
            exit 0
          fi

          echo "Initial ECS stabilization failed. Attempting automated recovery."
          print_diagnostics

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count 0 > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --desired-count "$DESIRED_COUNT" \
            --force-new-deployment > /dev/null

          if aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "ECS service stabilized after automated recovery."
            exit 0
          fi

          echo "ECS service failed to stabilize after recovery."
          print_diagnostics
          exit 1
      - name: Verify backend readiness
        env:
          ALB_DNS_NAME: ${{ needs.terraform.outputs.alb_dns_name }}
        run: |
          set -euo pipefail

          READY_URL="http://${ALB_DNS_NAME}/api/ready"
          echo "Probing readiness endpoint: $READY_URL"

          for attempt in $(seq 1 18); do
            status_code=$(curl -sS -o /tmp/backend-ready.json -w "%{http_code}" "$READY_URL" || true)
            if [ "$status_code" = "200" ]; then
              echo "Backend readiness check passed."
              cat /tmp/backend-ready.json
              exit 0
            fi

            echo "Readiness probe attempt $attempt/18 returned HTTP $status_code"
            cat /tmp/backend-ready.json || true
            sleep 10
          done

          echo "Backend readiness check failed after retries."
          exit 1

  deploy-frontend:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build & Deploy
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: |
          npm install
          cd client && npm run build
          cd ..
          aws s3 sync client/dist/ s3://propertyflow-dev-frontend --delete
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform.outputs.cloudfront_distribution_id }} --paths "/*"
